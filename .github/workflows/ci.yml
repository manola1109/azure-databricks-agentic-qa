name: CI

# The eval job needs Azure OIDC (to reach Databricks Agent Evaluation's hosted judges) and a
# GROQ_API_KEY secret (to run the agent + ingestion against the golden set). Required repo
# environment secrets, same three cd.yml already documents plus one:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, DATABRICKS_HOST, GROQ_API_KEY,
#   SEC_EDGAR_USER_AGENT (e.g. "PolicyPilot research you@example.com")

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button: the only way to run agent-eval outside a PR

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  agent-eval:
    # Each run spends ~66k of the Groq free tier's 200k tokens/day, so it runs on PRs and
    # manual runs only, not on every push to main.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: ci
    permissions:
      id-token: write # required for OIDC
      contents: read
    env:
      PP_ENV: local
      PP_RETRIEVAL_K: "3" # Groq free tier caps requests at 8,000 tokens/minute
      # Groq's free tier also caps tokens/day, so CI evaluates a fixed 10-question sample
      # (plus the off-corpus refusal check), one at a time, retrying 429s patiently.
      PP_EVAL_LIMIT: "10"
      PP_GROQ_MAX_RETRIES: "10"
      MLFLOW_GENAI_EVAL_MAX_WORKERS: "1"
      MLFLOW_GENAI_EVAL_MAX_RETRIES: "8" # judge 429s; default 3 gave up too early
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # SEC returns 403 without a real contact email; kept in a secret so it isn't public.
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra eval

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ingest golden-set corpus into a fresh local Chroma store
        run: uv run python -m policypilot.ingestion.pipeline
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}

      - name: Run Databricks Agent Evaluation against the golden set
        run: uv run python -m policypilot.eval.agent_eval
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
